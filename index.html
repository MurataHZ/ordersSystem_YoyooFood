      const o=state.completed.find(o=>o.id===modal.id);
      if(!o)return closeModal();
      content=`<div class="modal-top"><h2>永久删除这笔订单？</h2>${modalClose()}</div><p class="confirm-copy"><strong>删除该订单会永久失去该订单的信息。</strong><br>当前订单数量将减少 1 单，当前总金额将减少 NZ$${money(o.accountingCents)}。此操作无法撤销。</p><div class="confirm-order">订单 ${number(o.number)} · ${label(o,false)}<br>珍珠：${pearlName(o.pearl,false)} · Size：${SIZES[o.size].zh}</div><div class="confirm-actions" style="margin-top:20px"><button class="secondary-btn" data-action="dismiss">取消</button><button class="danger-btn" data-action="confirm-delete-sales" data-id="${esc(o.id)}" ${!canMutate()?'disabled':''}>确认永久删除</button></div>`;
    }else if(modal.type==='archive-confirm'){
      outside=false;
      content=`<div class="modal-top"><h2>永久归档当前列表？</h2>${modalClose()}</div><p class="confirm-copy">将当前 <strong>${modal.ids.length} 单 · NZ$${money(modal.cents)}</strong> 计入上方的已归档数据。<br>当前列表将清空，金额和数量会保留。日期、数量和金额可在“详细历史”查看；订单明细无法恢复或撤销。</p><div class="confirm-actions"><button class="secondary-btn" data-action="dismiss">取消</button><button class="primary-btn" data-action="confirm-archive" ${!canMutate()?'disabled':''}>确认归档</button></div>`;
    }else{
      outside=false;
      content=`<div class="modal-top"><h2>${DEMO?'先试一试，再开始营业':'两台手机，一份订单'}</h2>${modalClose()}</div><div class="help-copy">${DEMO?'<p><strong>当前是本机测试。</strong>新建、完成、删除、撤销与销售统计都可以操作；记录保存在此浏览器。不同手机打开测试文件，不会互相同步。</p>':'<p><strong>当前是双机同步模式。</strong>两台手机打开同一个完整访问地址，一台进入前端，另一台进入后端。订单约每秒更新，回到页面会立即刷新。</p>'}<p>双机使用：在电脑解压项目，启动 <strong>start-windows.cmd</strong>，再让两台手机与电脑连接同一个 Wi-Fi，使用 Safari 打开启动窗口中的“手机访问”地址。</p><p>不需要外网。营业期间保持电脑开机、服务窗口打开；手机锁屏后停止刷新，唤醒页面会重新同步。</p><p>小杯 500 mL：<strong>NZ$5.99</strong><br>大杯 700 mL：<strong>NZ$6.99</strong></p><p>“完成订单”将队首移入销售信息；撤销会将最近一次删除或完成的订单放回队首，并扣回对应销售金额。</p><p>同步版数据保存在电脑。不要在正式营业时切换测试模式；测试记录与同步版记录相互独立。</p></div><button class="primary-btn" data-action="dismiss" style="font-size:14px;min-height:47px;margin-top:17px">知道了</button>`;
    }
    $('modal-root').innerHTML=`<div class="modal-overlay" data-action="overlay-dismiss"><section class="modal-sheet" role="dialog" aria-modal="true" aria-label="${modal.type==='detail'?'订单详情':modal.type==='help'?'使用说明':'确认操作'}" data-close-anywhere="${outside}">${content}</section></div>`;
  }
  function modalClose(){return `<button class="modal-close" data-action="dismiss" aria-label="关闭">${icon('close')}</button>`;}

  function applyLocal(s,action,payload){
    if(action==='create'){
      if(!Array.isArray(payload.flavors)||payload.flavors.length!==2||!payload.flavors.every(f=>Object.hasOwn(FLAVORS,f))||!Object.hasOwn(PEARLS,payload.pearl)||!Object.hasOwn(SIZES,payload.size))throw Error('请选择完整的口味、珍珠和 Size。');
      s.queue.push({id:uuid(),number:s.nextNumber++,flavors:[...payload.flavors],pearl:payload.pearl,size:payload.size,priceCents:SIZES[payload.size].cents,accountingCents:SIZES[payload.size].accountingCents,createdAt:new Date().toISOString()});
    }else if(action==='complete'){
      if(!s.queue.length||s.queue[0].id!==payload.id)throw Error('队首订单已变化，请核对后再完成。');
      const o=s.queue.shift();s.undo.push({kind:'complete',order:clone(o)});o.completedAt=new Date().toISOString();s.completed.push(o);
    }else if(action==='delete'||action==='sales_delete'){
      const list=action==='delete'?s.queue:s.completed,i=list.findIndex(o=>o.id===payload.id);
      if(i<0)throw Error('该订单已发生变化，请查看最新列表。');
      const [o]=list.splice(i,1);
      if(action==='delete')s.undo.push({kind:'delete',order:clone(o)});else s.undo=s.undo.filter(e=>e.order.id!==o.id);
    }else if(action==='undo'){
      const event=s.undo.pop();if(!event)throw Error('没有可以撤销的删除或归档。');
      s.completed=s.completed.filter(o=>o.id!==event.order.id);delete event.order.completedAt;s.queue.unshift(event.order);
    }else if(action==='archive'){
      if(!s.completed.length)throw Error('当前没有可以归档的订单。');
      if(JSON.stringify(payload.ids)!==JSON.stringify(s.completed.map(o=>o.id)))throw Error('完成订单列表已更新，请重新核对后归档。');
      s.archiveHistory.push({id:uuid(),date:orderDate(s.completed[0].createdAt),count:s.completed.length,cents:total(s.completed),archivedAt:new Date().toISOString(),legacy:false});
      s.archived.count+=s.completed.length;s.archived.cents+=total(s.completed);s.completed=[];
      const ids=new Set(payload.ids);s.undo=s.undo.filter(e=>!ids.has(e.order.id));
    }else throw Error('未知操作。');
    s.revision++;return s;
  }
  async function request(path,options={}){
    const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),5000);
    try{
      const response=await fetch(API_BASE+path,{...options,cache:'no-store',signal:abort.signal});
      let data;try{data=await response.json();}catch{throw Error('服务器返回了无法读取的内容。');}
      if(!response.ok){const error=Error(data.error||'操作失败，请重试。');error.definitive=response.status>=400&&response.status<500;throw error;}
      return validateState(data);
    }finally{clearTimeout(timeout);}
  }
  function accept(next){if(!loaded||next.revision>=state.revision){state=next;loaded=true;}}
  function savePending(value){
    if(storageAvailable){if(value)localStorage.setItem(PENDING_KEY,JSON.stringify(value));else localStorage.removeItem(PENDING_KEY);}
    pending=value;
  }
  async function sendPending(){
    if(!pending)return true;
    const command=pending;
    const next=await request('/api/commands',{method:'POST',headers:{'Content-Type':'application/json','X-Boba-Client':'1'},body:JSON.stringify(command)});
    accept(next);savePending(null);online=true;
    return true;
  }
  async function mutate(action,payload={}){
    if(!canMutate())return false;
    busy=true;render();
    try{
      if(DEMO){
        const next=applyLocal(storageAvailable?readLocal():clone(state),action,payload);
        if(storageCorrupt)throw Error('本机数据无法读取，已暂停操作。');
        if(storageAvailable)localStorage.setItem(DATA_KEY,JSON.stringify(next));
        state=next;
      }else{
        savePending({requestId:uuid(),action,payload});
        // Retry the SAME request ID. A lost response can never create a second cup.
        try{await sendPending();}catch(error){if(error.definitive)throw error;await sendPending();}
      }
      return true;
    }catch(error){
      if(error.definitive){savePending(null);await sync(true);}
      else if(!DEMO)online=false;
      const message=pending?'提交结果待核实。系统会自动重连，请勿重复下单。':error.name==='QuotaExceededError'?'浏览器存储空间不足，订单未保存。':error.message||'操作失败，请重试。';
      toast(message,true);return false;
    }finally{busy=false;render();}
  }
  async function sync(force=false){
    if(DEMO||polling||(!force&&busy)||document.hidden&&!force)return;
    polling=true;
    const before=state.revision,wasOnline=online,wasLoaded=loaded;
    try{
      if(pending&&!busy){
        busy=true;render();
        const resolved=pending.action;
        try{await sendPending();if(resolved==='create'&&route().page==='new'){draft={flavors:[],pearl:null,size:null};navigate('front');}closeModal();toast('上次操作已核实，订单已同步。');}
        catch(error){if(error.definitive){savePending(null);toast(error.message,true);}else throw error;}
        finally{busy=false;}
      }
      accept(await request('/api/state'));online=true;
    }catch{online=false;}
    finally{polling=false;if(state.revision!==before||online!==wasOnline||loaded!==wasLoaded||force)render();}
  }
  async function action(event){
    const target=event.target.closest('[data-action]');
    if(!target||target.disabled)return;
    const a=target.dataset.action;
    if(a==='overlay-dismiss'){
      const sheet=event.target.closest('.modal-sheet');
      if(!sheet||sheet.dataset.closeAnywhere==='true')closeModal();return;
    }
    if(a==='dismiss'){closeModal();return;}
    if(a==='help'){openModal({type:'help'});return;}
    if(a==='reconnect'){await sync(true);if(!online)toast('还没有连接上电脑，请检查 Wi-Fi 和服务器窗口。',true);return;}
    if(busy)return;
    if(a==='navigate'){navigate(target.dataset.page);return;}
    if(a==='home'){navigate('home');return;}
    if(a==='new'){draft={flavors:[],pearl:null,size:null};navigate('new/0');return;}
    if(a==='cancel'){draft={flavors:[],pearl:null,size:null};navigate('front');return;}
    if(a==='wizard-back'){const step=route().step;navigate(step?'new/'+(step-1):'front');return;}
    if(a==='choose'){
      const step=Number(target.dataset.step),v=target.dataset.value;
      if(step<2)draft.flavors[step]=v;else draft.pearl=v;
      navigate('new/'+(step+1));return;
    }
    if(a==='size'){draft.size=target.dataset.value;render();return;}
    if(a==='detail'){openModal({type:'detail',id:target.dataset.id,role:route().page});return;}
    if(a==='ask-delete-sales'){openModal({type:'delete-confirm',id:target.dataset.id});return;}
    if(a==='ask-archive'){openModal({type:'archive-confirm',ids:state.completed.map(o=>o.id),cents:total(state.completed)});return;}
    if(a==='submit'){
      if(await mutate('create',{flavors:[...draft.flavors],pearl:draft.pearl,size:draft.size})){
        const created=state.queue.at(-1);draft={flavors:[],pearl:null,size:null};navigate('front');toast(`订单 ${number(created?.number||state.nextNumber-1)} 已加入队尾`);
      }return;
    }
    if(a==='complete'){
      const first=state.queue[0];if(first&&await mutate('complete',{id:first.id}))toast(`订单 ${number(first.number)} 已完成`);return;
    }
    if(a==='undo'){if(await mutate('undo'))toast('订单已恢复到队首');return;}
    if(a==='delete-order'){if(await mutate('delete',{id:target.dataset.id})){closeModal();toast('订单已删除，可撤销');}return;}
    if(a==='confirm-delete-sales'){if(await mutate('sales_delete',{id:target.dataset.id})){closeModal();toast('订单已永久删除，金额已扣减');}return;}
    if(a==='confirm-archive'){
      const ids=[...(modal?.ids||[])];if(await mutate('archive',{ids})){closeModal();toast('当前列表已永久归档，数量与金额已累计');}return;
    }
  }
  document.addEventListener('click',event=>{action(event).catch(()=>{busy=false;render();toast('操作未完成，请重试。',true);});});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&modal){closeModal();event.preventDefault();}
    if(event.key==='Tab'&&modal){const buttons=[...$('modal-root').querySelectorAll('button:not(:disabled)')];if(!buttons.length)return;const first=buttons[0],last=buttons.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}
  });
  window.addEventListener('hashchange',()=>{
    closeModal();const r=route();
    if(r.page==='new'){
      const max=!draft.flavors[0]?0:!draft.flavors[1]?1:!draft.pearl?2:3;
      if(r.step>max){location.hash='new/'+max;return;}
    }
    lastScroll={};render();
    if($('wizard-content'))$('wizard-content').scrollTop=0;
  });
  window.addEventListener('storage',e=>{if(DEMO&&e.key===DATA_KEY&&!busy){state=readLocal();render();}});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(true);});
  window.addEventListener('online',()=>sync(true));
  window.addEventListener('pageshow',()=>sync(true));
  window.addEventListener('offline',()=>{if(!DEMO){online=false;render();}});
  window.addEventListener('beforeunload',event=>{if(!DEMO&&(pending||busy)){event.preventDefault();event.returnValue='';}});
  if(route().page==='new')location.hash='front';
  render();if(!DEMO){sync(true);setInterval(()=>sync(),1000);}
})();
</script>
</body>
